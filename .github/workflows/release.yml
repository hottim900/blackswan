name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag matches pyproject version
        run: |
          tag_version="${GITHUB_REF#refs/tags/v}"
          pyproject_version=$(grep -E '^version = "' pyproject.toml | sed -E 's/version = "([^"]+)"/\1/')
          echo "tag=$tag_version  pyproject=$pyproject_version"
          if [ "$tag_version" != "$pyproject_version" ]; then
            echo "::error::Tag v$tag_version does not match pyproject.toml version $pyproject_version"
            exit 1
          fi

      - name: Set up uv
        uses: astral-sh/setup-uv@v3

      - name: Create venv (Python 3.12)
        run: uv venv -p 3.12

      - name: Add venv to PATH
        run: echo "${{ github.workspace }}/.venv/bin" >> "$GITHUB_PATH"

      - name: Install package + dev deps
        run: uv pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Pytest
        run: pytest tests/

      - name: Generate release notes
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          prev_tag=$(git describe --tags --abbrev=0 --exclude="$tag" 2>/dev/null || true)
          {
            if [ -z "$prev_tag" ]; then
              echo "Initial release."
              echo ""
              echo "## Changes"
              git log --pretty=format:"- %s (%h)" --no-merges
            else
              echo "## Changes since $prev_tag"
              git log "${prev_tag}..HEAD" --pretty=format:"- %s (%h)" --no-merges
            fi
          } > /tmp/release-notes.md
          echo "--- preview ---"
          cat /tmp/release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" \
            --title "$tag" \
            --notes-file /tmp/release-notes.md
